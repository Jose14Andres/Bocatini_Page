version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bocatini-db
    restart: always
    environment:
      POSTGRES_DB: bocatini
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bocatini"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bocatini-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/bocatini
      # Orígenes permitidos por CORS (navegador -> backend). El frontend corre
      # en el navegador sobre http://localhost:3000.
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bocatini-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      # URL interna (contenedor -> contenedor) para fetch server-side en Next.
      # Usa el nombre del servicio Docker, NO localhost.
      - INTERNAL_API_URL=http://backend:8000
      # URL pública para peticiones desde el navegador del cliente.
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
